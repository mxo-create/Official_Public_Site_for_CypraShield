<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      (() => {
        const base = window.location.pathname.split('/').filter(Boolean)[0];
        const currentPath = window.location.pathname.replace(/^\/+/, '');
        const route = currentPath.startsWith(base + '/') ? currentPath.slice(base.length + 1) : currentPath;
        const target = `${window.location.origin}${base ? '/' + base : ''}/#/${route || ''}${window.location.search}`;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
